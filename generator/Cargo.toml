[package]
name = "superh-generator"
version = "0.1.0"
edition = "2024"
description = "Generates Rust code for superh from isa.yaml"
publish = false

[[bin]]
name = "superh-generator"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
indexmap = { version = "2.14.0", features = ["serde"] }
prettyplease = "0.2.37"
proc-macro2 = "1.0.106"
quote = "1.0.45"
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml = "0.9.34"
syn = { version = "2.0.117", features = ["full", "extra-traits"] }
