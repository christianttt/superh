  - name: DmulslRmRn
    opcode: "dmuls.l"
    args: "{rm}, {rn}"
    version: sh2
    pattern: "0011nnnnmmmm1101"
    fields: { n: reg, m: reg }
    defs: [mach, macl]
    uses: [rm, rn]

  - name: DmuluRmRn
    opcode: "dmulu.l"
    args: "{rm}, {rn}"
    version: sh2
