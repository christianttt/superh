# SuperH (SH) Instruction Set Architecture Definition
#
# Pattern characters:
#   0 / 1  = fixed bit
#   n      = Rn field (bits [11:8] by convention, but varies — see below)
#   m      = Rm field (bits  [7:4] by convention, but varies)
#   d      = displacement field
#   i      = immediate field
#   b      = banked-register index (SH3/SH4)
#   x      = don't-care bit (ignored in match, not extracted)
#
# Field types: reg | freg | dreg | vecreg | bankreg | uimm | simm | disp | branch_target
#
# Every opcode has a stable, non-reused id and an explicit architecture list.

opcodes:

  # ---------------------------------------------------------------------------
  # Data Transfer
  # ---------------------------------------------------------------------------

  - name: MovRmRn
    id: 0
    opcode: "mov"
    args: "{rm}, {rn}"
    architectures: [sh1, sh2, sh3, sh4]
    source: "rej09b0171:section-6:mov"
    pattern: "0110nnnnmmmm0011"
    fields: { n: reg, m: reg }
    defs: [rn]
    uses: [rm]

  - name: MovImmRn
    id: 1
    opcode: "mov"
    args: "#{imm}, {rn}"
    architectures: [sh1, sh2, sh3, sh4]
    source: "rej09b0171:section-6:mov"
    pattern: "1110nnnniiiiiiii"
    fields: { n: reg, i: simm }
    defs: [rn]
    uses: []

  - name: MovwAtDispPcRn
    id: 2
    opcode: "mov.w"
    args: "@({disp}, pc), {rn}"
    architectures: [sh1, sh2, sh3, sh4]
    source: "rej09b0171:section-6:mov.w"
    pattern: "1001nnnndddddddd"
    fields: { n: reg, d: disp }
    scale: 2
    pc_bias: 4
    defs: [rn]
    uses: []

  - name: MovlAtDispPcRn
    id: 3
    opcode: "mov.l"
    args: "@({disp}, pc), {rn}"
    architectures: [sh1, sh2, sh3, sh4]
    source: "rej09b0171:section-6:mov.l"
    pattern: "1101nnnndddddddd"
    fields: { n: reg, d: disp }
    scale: 4
    pc_bias: 4
    defs: [rn]
    uses: []

  # Store to @Rn
  - name: MovbRmAtRn
