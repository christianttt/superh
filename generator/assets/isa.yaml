    fields: { n: reg, m: reg }
    defs: [t]
    uses: [rm, rn]

  - name: Div0u
    opcode: "div0u"
    args: ""
    version: sh1
    pattern: "0000000000011001"
    fields: {}
    defs: [t]
    uses: []

  - name: Div1RmRn
    opcode: "div1"
    args: "{rm}, {rn}"
    version: sh1
    pattern: "0011nnnnmmmm0100"
    fields: { n: reg, m: reg }
