# SuperH (SH) Instruction Set Architecture Definition
#
# Pattern characters:
#   0 / 1  = fixed bit
#   n      = Rn field (bits [11:8] by convention, but varies — see below)
#   m      = Rm field (bits  [7:4] by convention, but varies)
#   d      = displacement field
#   i      = immediate field
#   b      = banked-register index (SH3/SH4)
#   x      = don't-care bit (ignored in match, not extracted)
#
# Field types: reg | freg | dreg | vecreg | bankreg | uimm | simm | disp | branch_target
#
# version: sh1 | sh2 | sh3 | sh4
#   sh2 implies sh1 available, sh3 implies sh2, sh4 implies sh3.

opcodes:

  # ---------------------------------------------------------------------------
  # Data Transfer
  # ---------------------------------------------------------------------------

  - name: MovRmRn
    opcode: "mov"
    args: "{rm}, {rn}"
    version: sh1
    pattern: "0110nnnnmmmm0011"
    fields: { n: reg, m: reg }
    defs: [rn]
    uses: [rm]

  - name: MovImmRn
    opcode: "mov"
    args: "#{imm}, {rn}"
    version: sh1
    pattern: "1110nnnniiiiiiii"
    fields: { n: reg, i: simm }
    defs: [rn]
    uses: []

  - name: MovwAtDispPcRn
    opcode: "mov.w"
    args: "@({disp}, pc), {rn}"
    version: sh1
    pattern: "1001nnnndddddddd"
    fields: { n: reg, d: disp }
    scale: 2
    pc_bias: 4
    defs: [rn]
    uses: []

  - name: MovlAtDispPcRn
    opcode: "mov.l"
    args: "@({disp}, pc), {rn}"
    version: sh1
    pattern: "1101nnnndddddddd"
    fields: { n: reg, d: disp }
    scale: 4
    pc_bias: 4
    defs: [rn]
    uses: []

  # Store to @Rn
  - name: MovbRmAtRn
    opcode: "mov.b"
    args: "{rm}, @{rn}"
    version: sh1
    pattern: "0010nnnnmmmm0000"
    fields: { n: reg, m: reg }
    defs: []
    uses: [rm, rn]

  - name: MovwRmAtRn
    opcode: "mov.w"
    args: "{rm}, @{rn}"
    version: sh1
    pattern: "0010nnnnmmmm0001"
    fields: { n: reg, m: reg }
    defs: []
    uses: [rm, rn]

  - name: MovlRmAtRn
    opcode: "mov.l"
    args: "{rm}, @{rn}"
    version: sh1
    pattern: "0010nnnnmmmm0010"
    fields: { n: reg, m: reg }
    defs: []
    uses: [rm, rn]

  # Load from @Rm
  - name: MovbAtRmRn
    opcode: "mov.b"
    args: "@{rm}, {rn}"
    version: sh1
    pattern: "0110nnnnmmmm0000"
    fields: { n: reg, m: reg }
    defs: [rn]
    uses: [rm]

  - name: MovwAtRmRn
    opcode: "mov.w"
    args: "@{rm}, {rn}"
    version: sh1
    pattern: "0110nnnnmmmm0001"
    fields: { n: reg, m: reg }
    defs: [rn]
    uses: [rm]

  - name: MovlAtRmRn
    opcode: "mov.l"
    args: "@{rm}, {rn}"
    version: sh1
    pattern: "0110nnnnmmmm0010"
    fields: { n: reg, m: reg }
    defs: [rn]
    uses: [rm]

  # Pre-decrement store @-Rn
  - name: MovbRmAtDecRn
    opcode: "mov.b"
    args: "{rm}, @-{rn}"
    version: sh1
    pattern: "0010nnnnmmmm0100"
    fields: { n: reg, m: reg }
    defs: [rn]
    uses: [rm, rn]

  - name: MovwRmAtDecRn
    opcode: "mov.w"
    args: "{rm}, @-{rn}"
    version: sh1
    pattern: "0010nnnnmmmm0101"
    fields: { n: reg, m: reg }
    defs: [rn]
    uses: [rm, rn]

  - name: MovlRmAtDecRn
    opcode: "mov.l"
    args: "{rm}, @-{rn}"
    version: sh1
    pattern: "0010nnnnmmmm0110"
    fields: { n: reg, m: reg }
    defs: [rn]
    uses: [rm, rn]

  # Post-increment load @Rm+
  - name: MovbAtRmIncRn
    opcode: "mov.b"
    args: "@{rm}+, {rn}"
    version: sh1
    pattern: "0110nnnnmmmm0100"
    fields: { n: reg, m: reg }
    defs: [rn, rm]
    uses: [rm]

  - name: MovwAtRmIncRn
    opcode: "mov.w"
    args: "@{rm}+, {rn}"
    version: sh1
    pattern: "0110nnnnmmmm0101"
    fields: { n: reg, m: reg }
    defs: [rn, rm]
    uses: [rm]

  - name: MovlAtRmIncRn
    opcode: "mov.l"
    args: "@{rm}+, {rn}"
    version: sh1
    pattern: "0110nnnnmmmm0110"
    fields: { n: reg, m: reg }
    defs: [rn, rm]
    uses: [rm]

  # Displacement store @(disp,Rn) — n is at [7:4], d at [3:0]
  - name: MovbR0AtDispRn
    opcode: "mov.b"
    args: "r0, @({disp}, {rn})"
    version: sh1
    pattern: "10000000nnnndddd"
    fields: { n: reg, d: disp }
    defs: []
    uses: [r0, rn]

  - name: MovwR0AtDispRn
    opcode: "mov.w"
    args: "r0, @({disp}, {rn})"
    version: sh1
    pattern: "10000001nnnndddd"
    fields: { n: reg, d: disp }
    scale: 2
    defs: []
    uses: [r0, rn]

  - name: MovlRmAtDispRn
    opcode: "mov.l"
    args: "{rm}, @({disp}, {rn})"
    version: sh1
    pattern: "0001nnnnmmmmdddd"
    fields: { n: reg, m: reg, d: disp }
    scale: 4
    defs: []
    uses: [rm, rn]

  # Displacement load @(disp,Rm) — m at [7:4], d at [3:0]
  - name: MovbAtDispRmR0
    opcode: "mov.b"
    args: "@({disp}, {rm}), r0"
    version: sh1
    pattern: "10000100mmmmdddd"
    fields: { m: reg, d: disp }
    defs: [r0]
    uses: [rm]

  - name: MovwAtDispRmR0
    opcode: "mov.w"
    args: "@({disp}, {rm}), r0"
    version: sh1
    pattern: "10000101mmmmdddd"
    fields: { m: reg, d: disp }
    scale: 2
    defs: [r0]
    uses: [rm]

  - name: MovlAtDispRmRn
    opcode: "mov.l"
    args: "@({disp}, {rm}), {rn}"
    version: sh1
    pattern: "0101nnnnmmmmdddd"
    fields: { n: reg, m: reg, d: disp }
    scale: 4
    defs: [rn]
    uses: [rm]

  # Indexed (R0+Rm) store/load
  - name: MovbRmAtR0Rn
    opcode: "mov.b"
    args: "{rm}, @(r0, {rn})"
    version: sh1
    pattern: "0000nnnnmmmm0100"
    fields: { n: reg, m: reg }
    defs: []
    uses: [r0, rm, rn]

  - name: MovwRmAtR0Rn
    opcode: "mov.w"
    args: "{rm}, @(r0, {rn})"
    version: sh1
    pattern: "0000nnnnmmmm0101"
    fields: { n: reg, m: reg }
    defs: []
    uses: [r0, rm, rn]

  - name: MovlRmAtR0Rn
    opcode: "mov.l"
    args: "{rm}, @(r0, {rn})"
    version: sh1
    pattern: "0000nnnnmmmm0110"
    fields: { n: reg, m: reg }
    defs: []
    uses: [r0, rm, rn]

  - name: MovbAtR0RmRn
    opcode: "mov.b"
    args: "@(r0, {rm}), {rn}"
    version: sh1
    pattern: "0000nnnnmmmm1100"
    fields: { n: reg, m: reg }
    defs: [rn]
    uses: [r0, rm]

  - name: MovwAtR0RmRn
    opcode: "mov.w"
    args: "@(r0, {rm}), {rn}"
    version: sh1
    pattern: "0000nnnnmmmm1101"
    fields: { n: reg, m: reg }
    defs: [rn]
    uses: [r0, rm]

  - name: MovlAtR0RmRn
    opcode: "mov.l"
    args: "@(r0, {rm}), {rn}"
    version: sh1
    pattern: "0000nnnnmmmm1110"
    fields: { n: reg, m: reg }
    defs: [rn]
    uses: [r0, rm]

  # GBR-relative
  - name: MovbR0AtDispGbr
    opcode: "mov.b"
    args: "r0, @({disp}, gbr)"
    version: sh1
    pattern: "11000000dddddddd"
    fields: { d: disp }
    defs: []
    uses: [r0, gbr]

  - name: MovwR0AtDispGbr
    opcode: "mov.w"
    args: "r0, @({disp}, gbr)"
    version: sh1
    pattern: "11000001dddddddd"
    fields: { d: disp }
    scale: 2
    defs: []
    uses: [r0, gbr]

  - name: MovlR0AtDispGbr
    opcode: "mov.l"
    args: "r0, @({disp}, gbr)"
    version: sh1
    pattern: "11000010dddddddd"
    fields: { d: disp }
    scale: 4
    defs: []
    uses: [r0, gbr]

  - name: MovbAtDispGbrR0
    opcode: "mov.b"
    args: "@({disp}, gbr), r0"
    version: sh1
    pattern: "11000100dddddddd"
    fields: { d: disp }
    defs: [r0]
    uses: [gbr]

  - name: MovwAtDispGbrR0
    opcode: "mov.w"
    args: "@({disp}, gbr), r0"
    version: sh1
    pattern: "11000101dddddddd"
    fields: { d: disp }
    scale: 2
    defs: [r0]
    uses: [gbr]

  - name: MovlAtDispGbrR0
    opcode: "mov.l"
    args: "@({disp}, gbr), r0"
    version: sh1
    pattern: "11000110dddddddd"
    fields: { d: disp }
    scale: 4
    defs: [r0]
    uses: [gbr]

  # MOVA — load effective address
  - name: Mova
    opcode: "mova"
    args: "@({disp}, pc), r0"
    version: sh1
    pattern: "11000111dddddddd"
    fields: { d: disp }
    scale: 4
    pc_bias: 4
    defs: [r0]
    uses: []

  # MOVT — move T bit
  - name: Movt
    opcode: "movt"
    args: "{rn}"
    version: sh1
    pattern: "0000nnnn00101001"
    fields: { n: reg }
    defs: [rn]
    uses: [t]

  # MOVCA.L — move with cache bypass (SH4)
  - name: MovcalR0AtRn
    opcode: "movca.l"
    args: "r0, @{rn}"
    version: sh4
    pattern: "0000nnnn11000011"
    fields: { n: reg }
    defs: []
    uses: [r0, rn]

  # SWAP
  - name: SwapbRmRn
    opcode: "swap.b"
    args: "{rm}, {rn}"
    version: sh1
    pattern: "0110nnnnmmmm1000"
    fields: { n: reg, m: reg }
