    uses: [rm, rn]

  - name: CmpplRn
    opcode: "cmp/pl"
    args: "{rn}"
    version: sh1
    pattern: "0100nnnn00010101"
    fields: { n: reg }
    defs: [t]
    uses: [rn]

  - name: CmppzRn
    opcode: "cmp/pz"
    args: "{rn}"
    version: sh1
    pattern: "0100nnnn00010001"
    fields: { n: reg }
