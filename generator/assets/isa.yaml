    uses: [rm]

  # XTRCT
  - name: XtrctRmRn
    opcode: "xtrct"
    args: "{rm}, {rn}"
    version: sh1
    pattern: "0010nnnnmmmm1101"
    fields: { n: reg, m: reg }
    defs: [rn]
    uses: [rm, rn]

