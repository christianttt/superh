    args: "{rm}, {rn}"
    version: sh1
    pattern: "0011nnnnmmmm1111"
    fields: { n: reg, m: reg }
    defs: [rn, t]
    uses: [rm, rn]

  - name: CmpeqImmR0
    opcode: "cmp/eq"
    args: "#{imm}, r0"
    version: sh1
    pattern: "10001000iiiiiiii"
    fields: { i: simm }
    defs: [t]
    uses: [r0]

  - name: CmpeqRmRn
    opcode: "cmp/eq"
    args: "{rm}, {rn}"
    version: sh1
    pattern: "0011nnnnmmmm0000"
    fields: { n: reg, m: reg }
    defs: [t]
    uses: [rm, rn]

  - name: CmpgeRmRn
    opcode: "cmp/ge"
    args: "{rm}, {rn}"
    version: sh1
    pattern: "0011nnnnmmmm0011"
    fields: { n: reg, m: reg }
    defs: [t]
    uses: [rm, rn]

  - name: CmpgtRmRn
    opcode: "cmp/gt"
    args: "{rm}, {rn}"
    version: sh1
    pattern: "0011nnnnmmmm0111"
    fields: { n: reg, m: reg }
    defs: [t]
    uses: [rm, rn]

  - name: CmphiRmRn
    opcode: "cmp/hi"
    args: "{rm}, {rn}"
    version: sh1
    pattern: "0011nnnnmmmm0110"
    fields: { n: reg, m: reg }
